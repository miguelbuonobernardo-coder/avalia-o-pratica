<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timão Notícias - Atualizado</title>
    <style>
        /* Variáveis de Cores (Modo Claro/Padrão) */
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #111111;
            --accent-color: #000000;
            --border-color: #e0e0e0;
            --button-bg: #f0f0f0;
            --like-color: #28a745;
            --dislike-color: #dc3545;
        }

        /* Variáveis de Cores (Modo Escuro) */
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f4f4f9;
            --accent-color: #ffffff;
            --border-color: #333333;
            --button-bg: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            background-color: #000000;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #cc0000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            background: none;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Layout Principal */
        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .live-indicator {
            background-color: #cc0000;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* Card de Notícia */
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .news-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .news-content {
            padding: 1.5rem;
        }

        .news-time {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 0.5rem;
        }

        .news-title {
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
        }

        .news-excerpt {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        /* Botões de Ação */
        .actions {
            display: flex;
            gap: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .btn-action {
            background-color: var(--button-bg);
            border: 2px solid transparent;
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-like:hover { color: var(--like-color); }
        .btn-dislike:hover { color: var(--dislike-color); }

        /* Estilos quando o botão está ativo (votado) */
        .btn-like.active {
            background-color: rgba(40, 167, 69, 0.15);
            border-color: var(--like-color);
            color: var(--like-color);
        }

        .btn-dislike.active {
            background-color: rgba(220, 53, 69, 0.15);
            border-color: var(--dislike-color);
            color: var(--dislike-color);
        }

        /* Rodapé */
        footer {
            margin-top: auto;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🦅</span> Timão Notícias
        </div>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">Modo Escuro 🌙</button>
    </header>

    <main>
        <div class="feed-header">
            <h2>Últimas Novidades</h2>
            <span class="live-indicator">● AGORA</span>
        </div>

        <article class="news-card">
            <img src="https://images.unsplash.com/photo-1570498730906-896ac03ff59f?auto=format&fit=crop&w=800&q=80" alt="Vista da Neo Química Arena" class="news-image">
            <div class="news-content">
                <div class="news-time">Atualizado há 1 minuto</div>
                <h3 class="news-title">Clássico na Arena: Expectativas e Preparação</h3>
                <p class="news-excerpt">A Neo Química Arena se prepara para receber mais um grande clássico. Saiba como o Timão vem se preparando para garantir a vitória diante da Fiel.</p>
                <div class="actions">
                    <button class="btn-action btn-like" onclick="handleVote(this, 'like')">👍 <span>155</span></button>
                    <button class="btn-action btn-dislike" onclick="handleVote(this, 'dislike')">👎 <span>10</span></button>
                </div>
            </div>
        </article>

        <article class="news-card">
            <img src="https://images
